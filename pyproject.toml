[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics_utilities"
version = "0.1.0"
description = "A collection of utilities for A/B test analysis"
authors = [{name = "saramcneilly"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "statsmodels",
    "scipy",
    "matplotlib",
    "plotly",
    "google-cloud-bigquery",
]

[project.urls]
Repository = "https://github.com/sarasite/analytics_utilities"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"